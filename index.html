<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AlmacénQR: demo de programa de gestión de almacén (SGA) con códigos QR para móvil o PDA: entradas, salidas, ubicaciones, preparación de pedidos, recepción de albaranes e inventario.">
<meta name="theme-color" content="#1f3a56">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AlmacénQR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: app de móvil a una columna (máx. 560 px), cabecera fija arriba y barra de navegación abajo con el botón de escanear en el centro. Señalética de almacén: tinta azul acero + ámbar de seguridad. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#16202b; --ink-2:#4a5866; --line:#d5dbe2;
  --acc:#f2a900; --acc-ink:#1b1400; --steel:#1f3a56; --steel-2:#2d5279;
  --ok:#1d8a4e; --warn:#b86e00; --bad:#c2352b; --chip:#e4e9ef;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#18212b; --ink:#e7edf3; --ink-2:#9aa8b6; --line:#2a3745;
  --acc:#f5b622; --acc-ink:#1b1400; --steel:#9cc2ea; --steel-2:#7fb0e0;
  --ok:#3fbf78; --warn:#e3a33a; --bad:#ef6a5f; --chip:#22303d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#18212b; --ink:#e7edf3; --ink-2:#9aa8b6; --line:#2a3745;
  --acc:#f5b622; --acc-ink:#1b1400; --steel:#9cc2ea; --steel-2:#7fb0e0;
  --ok:#3fbf78; --warn:#e3a33a; --bad:#ef6a5f; --chip:#22303d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#1f3a56}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#1f3a56;color:#fff;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:6px;background:#f2a900;display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.top .sub{font-size:12px;opacity:.8}
.top .user{margin-left:auto;font-size:12px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:20px;padding:6px 10px;font-family:var(--f-ui);cursor:pointer}
main{flex:1;padding-block:14px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-2);margin:4px 0 0;font-weight:600}
.demo-band{font-size:12.5px;color:var(--ink-2);background:var(--chip);border-radius:8px;padding:8px 10px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acc-btn{border:0;border-radius:var(--r);padding:12px 6px;font-family:var(--f-ui);font-weight:700;font-size:15px;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}
.acc-btn small{font-weight:500;font-size:11.5px;opacity:.9}
.acc-btn:disabled{opacity:.4;cursor:default}
.acc-btn.in{background:#1d8a4e} .acc-btn.out{background:#c2352b} .acc-btn.mv{background:#2d5279}
.tareas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;display:flex;flex-direction:column;gap:2px}
.tarea b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.tarea span{font-size:12.5px;color:var(--ink-2);line-height:1.2}
.tarea.hot{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;color:inherit;font-family:inherit;font-size:inherit;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row:focus-visible,.acc-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--ink-2)}
.row .n{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.code{font-family:var(--f-code);font-size:12.5px;background:var(--chip);border-radius:5px;padding:1px 6px;white-space:nowrap}
.pill{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 8px;white-space:nowrap}
.pill.in{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.out{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.mv{background:color-mix(in srgb,var(--steel-2) 20%,transparent);color:var(--steel-2)}
.pill.low,.pill.adj{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.done{background:var(--ok);color:#fff}
.empty{padding:16px;color:var(--ink-2);font-size:14px}
input,select{width:100%;font-family:var(--f-ui);font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:600}
.with-scan{display:flex;gap:6px}
.with-scan input,.with-scan select{flex:1;min-width:0}
.scan-mini{flex:none;width:46px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);cursor:pointer;display:grid;place-items:center;font-family:var(--f-ui);font-weight:700}
.scan-mini svg{width:22px;height:22px}
.btn{border:0;border-radius:var(--r);padding:12px 16px;font-family:var(--f-ui);font-weight:700;font-size:16px;cursor:pointer;background:#1f3a56;color:#fff}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.okb{background:#1d8a4e}
.btn.badb{background:#c2352b}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:4px;gap:4px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{border:0;background:none;padding:9px 4px;border-radius:7px;font-family:var(--f-ui);font-weight:700;font-size:14.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button[aria-pressed="true"].in{background:#1d8a4e;color:#fff}
.seg button[aria-pressed="true"].out{background:#c2352b;color:#fff}
.seg button[aria-pressed="true"].mv{background:#2d5279;color:#fff}
.hint{font-size:12.5px;color:var(--ink-2);margin:0}
.hint.bad{color:var(--bad);font-weight:600}
.hint.ok{color:var(--ok);font-weight:600}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bottom button{border:0;background:none;font-family:var(--f-ui);font-size:11.5px;color:var(--ink-2);padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.bottom button .badge{position:absolute;top:4px;left:calc(50% + 6px);background:#c2352b;color:#fff;border-radius:10px;font-size:10.5px;font-weight:700;padding:0 5px;line-height:16px}
nav.bottom button.scan{transform:translateY(-14px)}
nav.bottom button.scan .ring{width:60px;height:60px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);color:var(--acc-ink)}
nav.bottom button.scan .ring svg{width:30px;height:30px}
.map{display:flex;flex-direction:column;gap:12px}
.aisle{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.aisle h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between}
.aisle h3 span{font-weight:500;color:var(--ink-2);font-size:12.5px}
.racks{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.rack{display:flex;flex-direction:column-reverse;gap:3px}
.slot{border:1px solid var(--line);border-radius:4px;height:30px;font-family:var(--f-code);font-size:10px;display:grid;place-items:center;cursor:pointer;background:var(--bg);color:var(--ink-2);padding:0}
.slot.full{background:color-mix(in srgb,var(--steel-2) 30%,var(--panel));color:var(--ink);border-color:color-mix(in srgb,var(--steel-2) 60%,var(--line))}
.slot.hl{outline:3px solid var(--acc);outline-offset:1px}
.rack-n{font-family:var(--f-code);font-size:10.5px;text-align:center;color:var(--ink-2)}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zone{border:1px dashed var(--line);border-radius:var(--r);padding:10px;background:var(--panel);cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.zone b{display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;
  padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h3{margin:0;font-size:18px;flex:1;min-width:0}
.x{border:0;background:var(--chip);color:var(--ink);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;flex:none}
.video-box{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:1/1;max-width:100%}
.video-box video{width:100%;height:100%;object-fit:cover}
.video-box .frame{position:absolute;inset:18%;border:3px solid #f2a900;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.photo-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 14px;border:2px dashed var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;color:var(--ink);font-family:inherit;font-size:16px;font-weight:700;width:100%}
.photo-btn svg{width:44px;height:44px;color:var(--steel-2)}
.photo-btn small{font-weight:400;color:var(--ink-2);font-size:13px}
.sim-ok{border:1px dashed var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--panel));color:var(--ink);border-radius:8px;padding:10px;font-family:inherit;font-size:14px;cursor:pointer;text-align:left}
.labels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.label{background:#fff;color:#111;border:1px solid #c9cfd6;border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.label svg{width:100%;max-width:150px;height:auto}
.label .lc{font-family:var(--f-code);font-weight:600;font-size:14px}
.label .ln{font-size:11.5px;line-height:1.2}
.label.u{border:3px solid #111}
.label.u .lc{font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:24px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.25);text-align:center}
.toast.bad{background:#c2352b;color:#fff}
.det-head{display:flex;gap:12px;align-items:center}
.det-head .qr{width:84px;flex:none;background:#fff;border-radius:6px;padding:4px}
.det-head .qr svg{width:100%;height:auto;display:block}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-family:var(--f-ui);font-size:13.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:#1f3a56;color:#fff;border-color:transparent}
/* tareas guiadas */
.paso{background:var(--panel);border:2px solid var(--acc);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.paso .ir{font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.paso .ubi{font-family:var(--f-code);font-size:34px;font-weight:600;line-height:1}
.paso .ubi-n{font-size:13px;color:var(--ink-2)}
.paso .prod{font-weight:700;font-size:17px}
.check{display:flex;gap:8px;align-items:center;font-size:14.5px}
.check i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.check.ok i{background:#1d8a4e;border-color:#1d8a4e;color:#fff}
.check.ok{color:var(--ok);font-weight:600}
.barra{height:8px;border-radius:8px;background:var(--chip);overflow:hidden}
.barra > span{display:block;height:100%;background:var(--acc)}
.cnt{display:flex;align-items:center;gap:6px}
.cnt button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;flex:none}
.cnt input{width:70px;text-align:center;font-variant-numeric:tabular-nums;padding:8px 4px}
.estado-l{font-size:12px;font-weight:700}
.estado-l.ok{color:var(--ok)} .estado-l.falta{color:var(--bad)} .estado-l.sobra{color:var(--warn)} .estado-l.pend{color:var(--ink-2)}
/* panel */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--ink-2);font-size:10px;font-family:var(--f-ui)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .b-in{fill:#1d8a4e} .chart .b-out{fill:#c2352b}
:root[data-theme="dark"] .chart .b-in{fill:#3fbf78} :root[data-theme="dark"] .chart .b-out{fill:#ef6a5f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chart .b-in{fill:#3fbf78} :root:not([data-theme="light"]) .chart .b-out{fill:#ef6a5f}}
.hbar{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hbar .tr{height:12px;background:var(--chip);border-radius:6px;overflow:hidden}
.hbar .tr span{display:block;height:100%;background:var(--steel-2)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
details.guion{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
details.guion summary{cursor:pointer;font-weight:700}
details.guion ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#1b1400" stroke-width="2.4"><path d="M3 9l9-5 9 5v11H3z"/><path d="M8 20v-6h8v6"/></svg></div>
    <div><h1>AlmacénQR</h1><div class="sub">Gestión de almacén · demo</div></div>
    <button class="user" id="btn-user" aria-label="Cambiar operario">👷 <span id="user-name">Operario 1</span></button>
  </header>
  <main id="view"></main>
  <nav class="bottom" aria-label="Secciones">
    <div class="in">
      <button data-go="inicio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H3z"/></svg>Inicio</button>
      <button data-go="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="8" height="7"/><rect x="13" y="4" width="8" height="7"/><rect x="3" y="13" width="8" height="7"/><rect x="13" y="13" width="8" height="7"/></svg>Stock</button>
      <button data-go="escanear" class="scan" aria-label="Escanear QR"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/><path d="M7 12h10"/></svg></span>Escanear</button>
      <button data-go="tareas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8.5 12l2 2 4-4M8.5 17h7"/></svg>Tareas<span class="badge" id="badge-tareas" hidden></span></button>
      <button data-go="panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Panel</button>
    </div>
  </nav>
</div>
<input type="file" id="foto" accept="image/*" capture="environment" hidden>

<script>
(() => {
'use strict';
const KEY = 'almacenqr-demo-v2';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('es-ES');
const dia = d => new Date(d).toISOString().slice(0,10);
const hoy = () => dia(Date.now());

/* ---------- Datos de ejemplo ---------- */
const PASILLOS = ['A','B','C'], ESTANT = 6, NIVELES = 3;
const ZONAS = [{c:'MUELLE-ENT', n:'Muelle de entrada', d:'Recepción de camiones'}, {c:'EXPED', n:'Expedición', d:'Pedidos preparados para salir'}];
const OPERARIOS = ['Operario 1','Operario 2','Operario 3','Jefe de almacén'];
function todasUbic(){ const u = ZONAS.map(z=>z.c); PASILLOS.forEach(p=>{ for(let e=1;e<=ESTANT;e++) for(let n=1;n<=NIVELES;n++) u.push(`${p}-${String(e).padStart(2,'0')}-${n}`); }); return u; }
const PRODUCTOS = [
  ['ELV-2C-4T','Elevador 2 columnas 4.000 kg','Elevadores',2,'ud'],
  ['ELV-4C-5T','Elevador 4 columnas 5.000 kg','Elevadores',1,'ud'],
  ['ELV-TIJ-3T','Elevador de tijera 3.000 kg','Elevadores',1,'ud'],

/* ---------- QR ---------- */
const qrTexto = (tipo,val) => `AQR:${tipo}:${val}`;
function qrSvg(text, cell=4){ const q = qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:cell, margin:2, scalable:true}); }
function interpretar(txt){
  txt = String(txt||'').trim();
  const m = txt.match(/^AQR:([PU]):(.+)$/);
  if(m) return m[1]==='P' ? (prod(m[2]) ? {tipo:'P', val:m[2]} : null) : (S.ubic.includes(m[2]) ? {tipo:'U', val:m[2]} : null);
  const up = txt.toUpperCase();
  if(prod(up)) return {tipo:'P', val:up};
  if(S.ubic.includes(up)) return {tipo:'U', val:up};
  return null;
}

let pick = null; // {id, paso:'ubic'|'prod'|'qty', tarea}
function tareasPicking(p){
  const t = [];
  p.lineas.forEach(l=>{
    let falta = l.qty - l.hecho; if(falta<=0) return;
    for(const s of stockDe(l.sku).filter(x=>!esZona(x.u)).sort((a,b)=>ordenUbic(a.u,b.u))){ if(falta<=0) break; const q=Math.min(falta,s.q); t.push({sku:l.sku, u:s.u, qty:q}); falta-=q; }
    if(falta>0) t.push({sku:l.sku, u:null, qty:falta});
  });
  return t.sort((a,b)=> a.u&&b.u ? ordenUbic(a.u,b.u) : a.u ? -1 : 1);
}

  if(!pick || pick.id!==id) pick = {id, paso:'ubic'};
  const tot=p.lineas.reduce((s,l)=>s+l.qty,0), h=p.lineas.reduce((s,l)=>s+Math.min(l.hecho,l.qty),0);
  const barra = `<div class="barra" aria-label="Progreso"><span style="width:${tot?Math.round(h/tot*100):0}%"></span></div><p class="hint">${h} de ${tot} unidades preparadas · ${esc(p.cliente)} (${esc(p.poblacion)})</p>`;
  const lineas = `<div class="list">${p.lineas.map(l=>`<div class="row static"><span class="main"><span class="t">${esc(pnom(l.sku))}</span><span class="s"><span class="code">${esc(l.sku)}</span></span></span><span class="n">${Math.min(l.hecho,l.qty)}/${l.qty}</span>${l.hecho>=l.qty?'<span class="pill done">✓</span>':''}</div>`).join('')}</div>`;
  if(p.estado==='expedido'){ pick=null; return sheet(p.id, barra + `<p class="hint ok">Pedido expedido. Ha salido del almacén.</p>` + lineas); }
  if(p.estado==='preparado'){
    pick=null;
    return sheet(p.id, barra + `<div class="paso"><div class="ir">Pedido completo</div><div class="prod">Todo está en la zona de Expedición</div><p class="hint">Al cargar el camión se registra la salida del almacén.</p><button class="btn badb full" id="btn-expedir">Registrar salida (expedir)</button></div>` + lineas, el=>{
      el.querySelector('#btn-expedir').onclick=()=>{ p.lineas.forEach(l=>{ const q=Math.min(S.stock[l.sku+'|EXPED']||0, l.qty); if(q>0){ mover(l.sku,'EXPED',null,q); registrar('salida',l.sku,q,'EXPED',null,p.id); } }); p.estado='expedido'; guardar(); cerrarSheet(); render(); toast(`${p.id} expedido`); };
    });
  }
  const ts = tareasPicking(p);
  const t = ts[0];
  if(!t){ p.estado='preparado'; guardar(); return abrirPedido(id); }
  pick.tarea = t;
  const num = p.lineas.length - p.lineas.filter(l=>l.hecho<l.qty).length + 1;
  if(!t.u){
    return sheet(p.id, barra + `<div class="paso"><div class="ir">Sin stock</div><div class="prod">${esc(pnom(t.sku))}</div><p class="hint bad">No queda stock de este producto para ${t.qty} ud. Avisa al jefe de almacén.</p><button class="btn sec full" id="btn-saltar">Marcar como incidencia y seguir</button></div>` + lineas, el=>{
      el.querySelector('#btn-saltar').onclick=()=>{ const l=p.lineas.find(x=>x.sku===t.sku); l.qty=l.hecho; p.incidencia='Falta stock de '+t.sku; guardar(); abrirPedido(id); };
    });
  }
  const okU = pick.paso!=='ubic', okP = pick.paso==='qty';
  sheet(`${p.id} · preparar`, barra + `
    <div class="paso">
      <div class="ir">Línea ${Math.min(num,p.lineas.length)} de ${p.lineas.length} · ve a</div>
      <div class="ubi">${esc(t.u)}</div><div class="ubi-n">${esc(nombreUbic(t.u))}</div>
      <div class="prod">Coge ${t.qty} × ${esc(pnom(t.sku))}</div><div><span class="code">${esc(t.sku)}</span></div>
      <div class="check ${okU?'ok':''}"><i>${okU?'✓':'1'}</i>Escanea la etiqueta de la estantería</div>
      <div class="check ${okP?'ok':''}"><i>${okP?'✓':'2'}</i>Escanea el producto</div>
      ${okP?`<label class="f" for="pk-qty">Cantidad cogida<div class="cnt"><button data-d="-1" aria-label="Menos">−</button><input id="pk-qty" type="number" inputmode="numeric" min="1" max="${t.qty}" value="${t.qty}"><button data-d="1" aria-label="Más">+</button></div></label>
        <button class="btn okb full" id="pk-ok">Confirmar y siguiente</button>`
      : `<button class="btn acc full" id="pk-scan">${ICON_SCAN.replace('<svg','<svg width="20" height="20" style="vertical-align:-4px"')} ${okU?'Escanear producto':'Escanear estantería'}</button>`}
    </div>` + lineas, el => {
      const sc = el.querySelector('#pk-scan');
      if(sc) sc.onclick = () => escanear({modo:'campo', espera: okU?'P':'U', sugerido: okU?qrTexto('P',t.sku):qrTexto('U',t.u), alLeer: r => {
        if(!okU){ if(r.val!==t.u){ vibrar([80,60,80]); toast(`Estantería equivocada: es ${t.u}`, true); } else { pick.paso='prod'; toast('Estantería correcta'); } }
        else { if(r.val!==t.sku){ vibrar([80,60,80]); toast(`Producto equivocado: buscas ${t.sku}`, true); } else { pick.paso='qty'; toast('Producto correcto'); } }
        abrirPedido(id);
      }});
      const q = el.querySelector('#pk-qty');
      el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ q.value=Math.max(1,Math.min(t.qty,(parseInt(q.value,10)||0)+ +b.dataset.d)); });
      const ok = el.querySelector('#pk-ok');
      if(ok) ok.onclick = () => {
        const n = Math.max(1, Math.min(t.qty, parseInt(q.value,10)||0));
        mover(t.sku, t.u, 'EXPED', n); registrar('mover', t.sku, n, t.u, 'EXPED', p.id);
        p.lineas.find(l=>l.sku===t.sku).hecho += n;
        if(p.estado==='pendiente') p.estado='en curso';
        if(p.lineas.every(l=>l.hecho>=l.qty)){ p.estado='preparado'; toast(`${p.id} preparado`); } else toast(`${n} × ${t.sku} preparado`);
        pick.paso='ubic'; guardar(); abrirPedido(id);
      };
  });
}

/* --- Recepción de albarán --- */
function abrirRecepcion(id){
  const r = S.recepciones.find(x=>x.id===id); if(!r) return;
  const est = l => l.recibido===0?['pend','Pendiente']:l.recibido<l.esperado?['falta',`Faltan ${l.esperado-l.recibido}`]:l.recibido>l.esperado?['sobra',`Sobran ${l.recibido-l.esperado}`]:['ok','Completo'];
  const cerrado = r.estado==='recibido';
  sheet(`${r.id} · ${r.proveedor}`, `
    ${cerrado?`<p class="hint ok">Recepción cerrada. La mercancía está en el muelle para ubicarla.${r.incidencia?' Incidencia: '+esc(r.incidencia):''}</p>`:`<button class="btn acc full" id="rc-scan">${ICON_SCAN.replace('<svg','<svg width="20" height="20" style="vertical-align:-4px"')} Escanear bulto</button><p class="hint">Cada lectura suma 1. Para cantidades grandes usa + y − o escribe el número.</p>`}
    <div class="list">${r.lineas.map((l,i)=>{ const [c,t]=est(l); return `<div class="row static"><span class="main"><span class="t">${esc(pnom(l.sku))}</span><span class="s"><span class="code">${esc(l.sku)}</span> · esperado ${l.esperado} · <span class="estado-l ${c}">${t}</span></span></span>${cerrado?`<span class="n">${l.recibido}</span>`:`<div class="cnt"><button data-i="${i}" data-d="-1" aria-label="Menos">−</button><input data-i="${i}" type="number" inputmode="numeric" min="0" value="${l.recibido}" aria-label="Recibido ${esc(l.sku)}"><button data-i="${i}" data-d="1" aria-label="Más">+</button></div>`}</div>`; }).join('')}</div>
    ${cerrado?'':`<button class="btn okb full" id="rc-ok">Cerrar recepción y dejar en el muelle</button>`}`, el => {
      if(cerrado) return;
      el.querySelector('#rc-scan').onclick = () => escanear({modo:'campo', espera:'P', sugerido: (()=>{ const l=r.lineas.find(x=>x.recibido<x.esperado)||r.lineas[0]; return qrTexto('P',l.sku); })(), alLeer: res => {
        const l = r.lineas.find(x=>x.sku===res.val);
        if(!l){ vibrar([80,60,80]); toast(`${res.val} no viene en este albarán`, true); }
        else { l.recibido++; guardar(); toast(`${res.val}: ${l.recibido}/${l.esperado}`); }
        abrirRecepcion(id);
      }});
      el.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{ const l=r.lineas[+b.dataset.i]; l.recibido=Math.max(0,l.recibido+ +b.dataset.d); guardar(); abrirRecepcion(id); });
      el.querySelectorAll('input[data-i]').forEach(inp=>inp.onchange=()=>{ r.lineas[+inp.dataset.i].recibido=Math.max(0,parseInt(inp.value,10)||0); guardar(); abrirRecepcion(id); });
      el.querySelector('#rc-ok').onclick = () => {
        const difs = r.lineas.filter(l=>l.recibido!==l.esperado);
        r.lineas.forEach(l=>{ if(l.recibido>0){ mover(l.sku,null,'MUELLE-ENT',l.recibido); registrar('entrada',l.sku,l.recibido,null,'MUELLE-ENT',r.id); } });
        r.estado='recibido'; r.incidencia = difs.length ? difs.map(l=>`${l.sku} ${l.recibido}/${l.esperado}`).join(', ') : '';
        guardar(); cerrarSheet(); render();
        toast(difs.length ? `Recepción cerrada con ${difs.length} diferencia(s)` : 'Recepción completa, mercancía en el muelle');
      };
  });
}

/* --- Inventario por hueco --- */
let inv = null; // {ubic, cont:{sku:n}}
function empezarInventario(){ escanear({modo:'campo', espera:'U', sugerido: qrTexto('U','C-04-3'), alLeer: r => { inv = {ubic:r.val, cont:{}}; enUbic(r.val).forEach(x=>inv.cont[x.sku]=''); abrirInventario(); }}); }
function abrirInventario(){
  if(!inv) return;
  const sis = Object.fromEntries(enUbic(inv.ubic).map(x=>[x.sku,x.q]));
  const skus = [...new Set([...Object.keys(sis), ...Object.keys(inv.cont)])];
  sheet(`Recuento · ${inv.ubic}`, `
    <p class="hint">${esc(nombreUbic(inv.ubic))}. Cuenta lo que hay físicamente y escríbelo; el sistema no te enseña su cantidad hasta que compares, para no condicionar el recuento.</p>
    <div class="list">${skus.length? skus.map(s=>`<div class="row static"><span class="main"><span class="t">${esc(pnom(s))}</span><span class="s"><span class="code">${esc(s)}</span>${sis[s]===undefined?' · <b>no estaba en este hueco</b>':''}</span></span><input data-sku="${esc(s)}" type="number" inputmode="numeric" min="0" placeholder="Contado" value="${inv.cont[s]??''}" style="width:96px;text-align:center" aria-label="Contado ${esc(s)}"></div>`).join('') : '<div class="empty">El sistema dice que este hueco está vacío.</div>'}</div>
    <button class="btn sec" id="inv-add">+ He encontrado otro producto (escanear)</button>
    <button class="btn acc full" id="inv-cmp">Comparar con el sistema</button>`, el => {
      el.querySelectorAll('input[data-sku]').forEach(i=>i.oninput=()=>{ inv.cont[i.dataset.sku]=i.value; });
      el.querySelector('#inv-add').onclick = () => escanear({modo:'campo', espera:'P', alLeer: r => { if(!(r.val in inv.cont)) inv.cont[r.val]=''; abrirInventario(); }});
      el.querySelector('#inv-cmp').onclick = () => {
        if(skus.some(s=>inv.cont[s]===''||inv.cont[s]===undefined)) return toast('Escribe la cantidad contada de cada producto (0 si no hay)', true);
        const difs = skus.map(s=>({sku:s, sistema:sis[s]||0, contado:Math.max(0,parseInt(inv.cont[s],10)||0)})).filter(d=>d.sistema!==d.contado);
        sheet(`Resultado · ${inv.ubic}`, `
          ${difs.length? `<p class="hint bad">${difs.length} diferencia(s) entre lo contado y el sistema.</p>` : '<p class="hint ok">Cuadra. Lo contado coincide con el sistema.</p>'}
          <div class="list">${skus.map(s=>{ const a=sis[s]||0, b=Math.max(0,parseInt(inv.cont[s],10)||0); return `<div class="row static"><span class="main"><span class="t">${esc(pnom(s))}</span><span class="s">Sistema ${a} · Contado ${b}</span></span><span class="n" style="color:${a===b?'var(--ok)':'var(--bad)'}">${b-a>0?'+':''}${b-a}</span></div>`; }).join('')}</div>
          <button class="btn ${difs.length?'acc':'okb'} full" id="inv-ok">${difs.length?'Ajustar el stock a lo contado':'Guardar recuento'}</button>
          <button class="btn sec full" id="inv-back">Volver a contar</button>`, el2 => {
            el2.querySelector('#inv-back').onclick = abrirInventario;
            el2.querySelector('#inv-ok').onclick = () => {
              difs.forEach(d=>{ const dlt=d.contado-d.sistema; if(dlt>0){ mover(d.sku,null,inv.ubic,dlt); registrar('ajuste',d.sku,dlt,null,inv.ubic,'Inventario'); } else { mover(d.sku,inv.ubic,null,-dlt); registrar('ajuste',d.sku,-dlt,inv.ubic,null,'Inventario'); } });
              S.inventarios.unshift({t:new Date().toISOString(), ubic:inv.ubic, user:S.user, difs});
              guardar(); inv=null; cerrarSheet(); tareaTab='inventario'; render();
              toast(difs.length?`Stock ajustado (${difs.length} referencia/s)`:'Recuento guardado');
            };
        });
      };
  });
}

async function descargar(nombre, filas){
  const csv = '﻿' + filas.map(f=>f.map(v=>{ v=String(v??''); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(';')).join('\r\n');
  await guardarArchivo(nombre, new Blob([csv],{type:'text/csv'}), 'Excel listo');
}
// Dentro de claude.ai usa la capacidad de descargas; en cualquier otra web, un enlace de descarga normal.
async function guardarArchivo(nombre, blob, okMsg){
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(e){}
  if(dl){ try { await dl.save({filename:nombre, data:blob}); toast(okMsg); } catch(e){ toast('Descarga cancelada'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast(okMsg);
}

async function descargarEtiquetaProducto(sku, copias){

// Dibuja las etiquetas en una hoja PNG de 3 columnas, lista para imprimir y recortar.
async function hojaPNG(items){
  const cols=Math.min(3, items.length), cw=400, ch=470, rows=Math.ceil(items.length/cols);
  const c=document.createElement('canvas'); c.width=cols*cw; c.height=rows*ch; const ctx=c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  items.forEach((it,i)=>{
    const x=(i%cols)*cw, y=Math.floor(i/cols)*ch;
    ctx.strokeStyle='#999'; ctx.setLineDash([8,6]); ctx.strokeRect(x+8,y+8,cw-16,ch-16); ctx.setLineDash([]);
    const q=qrcode(0,'M'); q.addData(it.txt); q.make(); const n=q.getModuleCount(), s=Math.floor(300/(n+4)), off=x+(cw-s*n)/2;
    ctx.fillStyle='#000'; for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) ctx.fillRect(off+k*s, y+30+r*s, s, s);
    ctx.textAlign='center'; ctx.font='600 30px "IBM Plex Mono", monospace'; ctx.fillText(it.c, x+cw/2, y+30+s*n+44);
    ctx.font='20px "IBM Plex Sans Condensed", sans-serif'; ctx.fillText(it.n.length>34?it.n.slice(0,33)+'…':it.n, x+cw/2, y+30+s*n+76);
  });
  return await new Promise(r=>c.toBlob(r,'image/png'));
}

/* ---------- Operación suelta (entrada / salida / mover) ---------- */
function operacion(tipo, pre={}){
  const o = {tipo, sku: pre.sku||'', qty: pre.qty||1, de: pre.de||'', a: pre.a||'', ref: pre.ref||''};
  if(o.de && !o.sku){ const c = enUbic(o.de); if(c.length===1) o.sku = c[0].sku; }
  if(tipo!=='entrada' && o.sku && !o.de){ const us=stockDe(o.sku).filter(x=>x.u!=='EXPED'); if(us.length) o.de = us[0].u; }
  const titulo = {entrada:'Entrada de mercancía', salida:'Salida suelta', mover:'Mover entre ubicaciones'};
  sheet(titulo[tipo], `<div class="seg" role="group" aria-label="Tipo de operación">
      <button class="in" data-t="entrada" aria-pressed="${tipo==='entrada'}">Entrada</button><button class="out" data-t="salida" aria-pressed="${tipo==='salida'}">Salida</button><button class="mv" data-t="mover" aria-pressed="${tipo==='mover'}">Mover</button></div>
    <div class="card" id="op-form"></div>`, el => {
    el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>operacion(b.dataset.t, {sku:o.sku, qty:o.qty, ref:o.ref}));
    const reabrir = () => operacion(tipo, o);
    const pintar = () => {
      const opProd = `<option value="">— Elige o escanea —</option>` + S.productos.map(p=>`<option value="${esc(p.sku)}" ${p.sku===o.sku?'selected':''}>${esc(p.sku)} · ${esc(p.nombre)}</option>`).join('');
      const origenes = o.sku ? stockDe(o.sku) : [];
      const opDe = `<option value="">— Elige o escanea —</option>` + origenes.map(x=>`<option value="${esc(x.u)}" ${x.u===o.de?'selected':''}>${esc(x.u)} (${x.q} uds)</option>`).join('');
      const opA = `<option value="">— Elige o escanea —</option>` + S.ubic.filter(u=>u!==o.de).map(u=>`<option value="${esc(u)}" ${u===o.a?'selected':''}>${esc(u)}${enUbic(u).length?' · ocupada':''}</option>`).join('');
      const disp = (o.sku && o.de) ? (S.stock[o.sku+'|'+o.de]||0) : null;
      let aviso = '';
      if(tipo!=='entrada' && disp!==null && o.qty>disp) aviso = `<p class="hint bad">Solo hay ${disp} en ${esc(o.de)}.</p>`;
      if(tipo==='mover' && o.a && o.sku){ const otros = enUbic(o.a).filter(x=>x.sku!==o.sku); if(otros.length) aviso += `<p class="hint">Aviso: ${esc(o.a)} ya tiene otra referencia (${esc(otros.map(x=>x.sku).join(', '))}).</p>`; }
      if(tipo!=='salida' && o.sku && !o.a){ const s = stockDe(o.sku).find(x=>!esZona(x.u)); if(s) aviso += `<p class="hint">Sugerencia: este producto ya está en <b>${esc(s.u)}</b>.</p>`; }
      el.querySelector('#op-form').innerHTML = `
        <label class="f" for="op-sku">1 · Producto<div class="with-scan"><select id="op-sku">${opProd}</select><button class="scan-mini" data-scanop="sku" aria-label="Escanear producto">${ICON_SCAN}</button></div></label>
        ${tipo!=='entrada'?`<label class="f" for="op-de">2 · Ubicación de origen<div class="with-scan"><select id="op-de" ${o.sku?'':'disabled'}>${opDe}</select><button class="scan-mini" data-scanop="de" aria-label="Escanear ubicación de origen">${ICON_SCAN}</button></div></label>`:''}
        ${tipo!=='salida'?`<label class="f" for="op-a">${tipo==='entrada'?'2':'3'} · Ubicación de destino<div class="with-scan"><select id="op-a">${opA}</select><button class="scan-mini" data-scanop="a" aria-label="Escanear ubicación de destino">${ICON_SCAN}</button></div></label>`:''}
        <label class="f" for="op-qty">Cantidad${disp!==null?` <span class="hint" style="font-weight:400;display:inline">(disponible ${disp})</span>`:''}<input id="op-qty" type="number" inputmode="numeric" min="1" value="${o.qty}"></label>
        <label class="f" for="op-ref">${tipo==='entrada'?'Albarán del proveedor':tipo==='salida'?'Nº de pedido / cliente':'Motivo'} (opcional)<input id="op-ref" type="text" maxlength="40" value="${esc(o.ref)}" placeholder="${tipo==='entrada'?'ALB-2026-0440':tipo==='salida'?'PED-1210':'Reposición picking'}"></label>
        ${aviso}
        <button class="btn full ${tipo==='entrada'?'okb':tipo==='salida'?'badb':''}" id="op-ok" ${tipo==='mover'?'style="background:#2d5279"':''}>Confirmar ${tipoTxt[tipo].toLowerCase()}</button>`;
      const f = el.querySelector('#op-form');
      f.querySelector('#op-sku').onchange = e=>{ o.sku=e.target.value; if(tipo!=='entrada'){ const us=stockDe(o.sku); o.de = us[0]?us[0].u:''; } pintar(); };
      const de=f.querySelector('#op-de'); if(de) de.onchange=e=>{o.de=e.target.value; pintar();};
      const a=f.querySelector('#op-a'); if(a) a.onchange=e=>{o.a=e.target.value; pintar();};
      f.querySelector('#op-qty').oninput=e=>{o.qty=Math.max(0,parseInt(e.target.value,10)||0);};
      f.querySelector('#op-qty').onchange=()=>pintar();
      f.querySelector('#op-ref').oninput=e=>{o.ref=e.target.value;};
      f.querySelectorAll('[data-scanop]').forEach(b=>b.onclick=()=>{ const campo=b.dataset.scanop; escanear({modo:'campo', espera: campo==='sku'?'P':'U', alLeer: r=>{ o[campo]=r.val; if(campo==='sku' && tipo!=='entrada' && !o.de){ const us=stockDe(o.sku); o.de=us[0]?us[0].u:''; } reabrir(); }}); });
      f.querySelector('#op-ok').onclick = () => confirmar(o);
    };
    pintar();
  });
}
function confirmar(o){
  if(!prod(o.sku)) return toast('Elige un producto', true);
  if(!(o.qty>0)) return toast('Pon una cantidad', true);
  if(o.tipo!=='salida' && !o.a) return toast('Elige la ubicación de destino', true);
  if(o.tipo!=='entrada'){ if(!o.de) return toast('Elige la ubicación de origen', true); const d=S.stock[o.sku+'|'+o.de]||0; if(o.qty>d) return toast(`Solo hay ${d} en ${o.de}`, true); }
  mover(o.sku, o.tipo==='entrada'?null:o.de, o.tipo==='salida'?null:o.a, o.qty);
  registrar(o.tipo, o.sku, o.qty, o.tipo==='entrada'?null:o.de, o.tipo==='salida'?null:o.a, (o.ref||'').trim());
  guardar(); cerrarSheet(); render();
  toast(`${tipoTxt[o.tipo]} registrada: ${o.qty} × ${o.sku}`);
}

/* ---------- Escáner ---------- */
let stream = null, raf = 0;
function pararCamara(){ cancelAnimationFrame(raf); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
function escanear(cfg){
  const titulo = cfg.modo==='global' ? 'Escanear código QR' : (cfg.espera==='P' ? 'Escanear producto' : 'Escanear estantería');
  const codigos = cfg.espera==='P' ? S.productos.map(p=>({c:p.sku,n:p.nombre,t:'P'})) : cfg.espera==='U' ? S.ubic.map(u=>({c:u,n:nombreUbic(u),t:'U'})) : [...S.productos.map(p=>({c:p.sku,n:p.nombre,t:'P'})), ...S.ubic.slice(0,8).map(u=>({c:u,n:nombreUbic(u),t:'U'}))];
  const sug = cfg.sugerido ? interpretar(cfg.sugerido) : null;
  sheet(titulo, `
    <div class="video-box" id="vbox" hidden><video id="vid" playsinline muted></video><div class="frame"></div></div>
    <button class="photo-btn" id="btn-foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Hacer foto del código QR<small>Se abre la cámara del móvil. Encuadra la etiqueta y haz la foto.</small></button>
    <p class="hint" id="scan-msg" role="status"></p>
    ${sug?`<button class="sim-ok" data-sim="${esc(cfg.sugerido)}"><b>Demo:</b> simular lectura de <span class="code">${esc(sug.val)}</span></button>`:''}
    <label class="f" for="manual">O escribe el código<div class="with-scan"><input id="manual" placeholder="${cfg.espera==='U'?'A-01-2':'ELV-2C-4T'}" autocomplete="off" autocapitalize="characters"><button class="scan-mini" id="manual-ok" aria-label="Usar código">OK</button></div></label>
    <details><summary class="hint">Simular otra lectura (para probar desde el ordenador)</summary><div class="list" style="margin-top:8px;max-height:240px;overflow:auto">${codigos.map(x=>`<button class="row" data-sim="${esc(qrTexto(x.t,x.c))}"><span class="code">${esc(x.c)}</span><span class="main"><span class="s">${esc(x.n)}</span></span></button>`).join('')}</div></details>`, el => {
    const msg = el.querySelector('#scan-msg');
    const usar = txt => { const r = interpretar(txt); if(!r){ msg.className='hint bad'; msg.textContent='Código no reconocido en este almacén.'; vibrar([80,60,80]); return; } if(cfg.espera && r.tipo!==cfg.espera){ msg.className='hint bad'; msg.textContent= cfg.espera==='P' ? 'Eso es una estantería; escanea la etiqueta del producto.' : 'Eso es un producto; escanea la etiqueta de la estantería.'; vibrar([80,60,80]); return; } vibrar(60); pararCamara(); cerrarSheet(); if(cfg.alLeer) cfg.alLeer(r); else { if(r.tipo==='P') verProducto(r.val); else verUbic(r.val); toast('Leído: '+r.val); } };
    el.querySelector('#btn-foto').onclick = () => { const f=$('#foto'); f.value=''; f.onchange = () => { const file=f.files[0]; if(!file) return; msg.className='hint'; msg.textContent='Leyendo la foto…'; leerFoto(file).then(t=>{ if(t) usar(t); else { msg.className='hint bad'; msg.textContent='No se ve ningún QR en la foto. Acércate un poco más y evita reflejos.'; } }).catch(()=>{ msg.className='hint bad'; msg.textContent='No se ha podido abrir la foto.'; }); }; f.click(); };
    el.querySelector('#manual-ok').onclick = () => usar(el.querySelector('#manual').value);
    el.querySelector('#manual').onkeydown = e => { if(e.key==='Enter') usar(e.target.value); };
    el.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>usar(b.dataset.sim));
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.jsQR){
      navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{
        if(!document.body.contains(el)){ s.getTracks().forEach(t=>t.stop()); return; }
        stream=s; const v=el.querySelector('#vid'); v.srcObject=s; v.play(); el.querySelector('#vbox').hidden=false;
        const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
        const tick=()=>{ if(!stream) return; if(v.readyState>=2){ const w=Math.min(640,v.videoWidth), h=Math.round(v.videoHeight*w/v.videoWidth); c.width=w; c.height=h; ctx.drawImage(v,0,0,w,h); const r=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'}); if(r&&r.data){ usar(r.data); return; } } raf=requestAnimationFrame(tick); };
        tick();
      }).catch(()=>{});
    }
  });
}
function leerFoto(file){
  return new Promise((ok, mal) => {
    if(!window.jsQR) return mal(new Error('sin lector'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
      let res=null;
      for(const max of [1400, 900, 2000]){
        const k=Math.min(1, max/Math.max(img.width,img.height)); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
        ctx.drawImage(img,0,0,c.width,c.height);
        const r=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});
        if(r&&r.data){ res=r.data; break; }
      }
      URL.revokeObjectURL(url); ok(res);
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('imagen')); };
    img.src = url;
  });
}

/* ---------- Eventos ---------- */
function montar(){
  const q=$('#q-stock'); if(q){ q.oninput=e=>{ filtroStock=e.target.value; const pos=e.target.selectionStart; render(); const n=$('#q-stock'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }; }
  const r=$('#btn-reset'); if(r) r.onclick=()=>{ if(r.dataset.conf){ S=seed(); pick=null; inv=null; guardar(); render(); toast('Demo reiniciada'); } else { r.dataset.conf='1'; r.textContent='Toca otra vez para confirmar'; setTimeout(()=>{ if(document.body.contains(r)){ delete r.dataset.conf; r.textContent='Reiniciar demo'; } },3000); } };
  const d=$('#btn-desc-etq'); if(d) d.onclick=descargarEtiquetas;
  const np=$('#btn-nuevo-pedido'); if(np) np.onclick=nuevoPedido;
  const bi=$('#btn-inv'); if(bi) bi.onclick=empezarInventario;
  const cs=$('#csv-stock'); if(cs) cs.onclick=()=>descargar('stock-por-ubicacion.csv', [['Referencia','Producto','Categoría','Ubicación','Cantidad','Unidad'], ...Object.entries(S.stock).filter(([k,q])=>q>0).map(([k,q])=>{ const [s,u]=k.split('|'); const p=prod(s)||{}; return [s,p.nombre,p.cat,u,q,p.ud]; }).sort((a,b)=>ordenUbic(a[3],b[3]))]);
  const cm=$('#csv-movs'); if(cm) cm.onclick=()=>descargar('movimientos.csv', [['Fecha','Hora','Tipo','Referencia','Producto','Cantidad','Origen','Destino','Documento','Operario'], ...S.movs.map(m=>{ const dt=new Date(m.t); return [dt.toLocaleDateString('es-ES'), dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}), tipoTxt[m.tipo], m.sku, pnom(m.sku), m.qty, m.de||'', m.a||'', m.ref, m.user]; })]);
}
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  const ds = b.dataset;
  if(ds.go){ ir(ds.go); return; }
  if(ds.go2){ cerrarSheet(); ir(ds.go2); return; }
  if(ds.op){ operacion(ds.op, {sku:ds.sku, de:ds.de, a:ds.a}); return; }
  if(ds.ubicar){ const sku=ds.ubicar; const s=stockDe(sku).find(x=>!esZona(x.u)); operacion('mover',{sku, de:'MUELLE-ENT', qty:S.stock[sku+'|MUELLE-ENT'], a:s?s.u:''}); return; }
  if(ds.prod){ verProducto(ds.prod); return; }
  if(ds.ubic && !b.closest('.sheet .paso')){ verUbic(ds.ubic); return; }
  if(ds.vermapa){ resaltar=ds.vermapa.split(','); stockModo='mapa'; cerrarSheet(); ir('stock'); return; }
  if(ds.cat){ catSel=ds.cat; render(); return; }
  if(ds.fmov){ filtroMov=ds.fmov; render(); return; }
  if(ds.etq){ etqTipo=ds.etq; render(); return; }
  if(ds.smodo){ stockModo=ds.smodo; render(); return; }
  if(ds.ttab){ tareaTab=ds.ttab; render(); return; }
  if(ds.tarea){ tareaTab=ds.tarea; ir('tareas'); return; }
  if(ds.pedido){ abrirPedido(ds.pedido); return; }
  if(ds.recep){ abrirRecepcion(ds.recep); return; }
  if(ds.recontar){ inv={ubic:ds.recontar, cont:{}}; enUbic(ds.recontar).forEach(x=>inv.cont[x.sku]=''); abrirInventario(); return; }
  if(ds.scanglobal){ escanear({modo:'global'}); return; }
  if(ds.nuevoprod){ nuevoProducto(); return; }
  if(ds.etqprod){ etiquetaLista(ds.etqprod, 0, ''); return; }
});
$('#btn-user').onclick = () => { S.user = OPERARIOS[(OPERARIOS.indexOf(S.user)+1)%OPERARIOS.length]; guardar(); render(); toast('Ahora trabajas como '+S.user); };
document.addEventListener('keydown', e => { if(e.key==='Escape'){ cerrarSheet(); render(); } });
render();
})();
</script>
<script>if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
